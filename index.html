<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TreasuryOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TreasuryOS: a portfolio treasury management system for the fictional Groupe Lumen, built by Saranne Ndamba. Synthetic data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a treasury workstation. Sticky top bar, module tabs, then dense panels on a two-column grid. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --raised: #F7F9F8;
  --ink: #14201C;
  --muted: #5B6A65;
  --line: #DCE3E0;
  --accent: #0E6B5B;
  --accent-soft: #DCEEEA;
  --pos: #1F7A4D;
  --neg: #B3261E;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --display: 'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
  --text: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #141D1A; --raised: #18231F; --ink: #E4ECE8; --muted: #93A49E; --line: #25332E;
    --accent: #4CC2A6; --accent-soft: #173A33; --pos: #5CC98E; --neg: #F27A70; --warn: #E9A846; --warn-soft: #3A2C14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #141D1A; --raised: #18231F; --ink: #E4ECE8; --muted: #93A49E; --line: #25332E;
  --accent: #4CC2A6; --accent-soft: #173A33; --pos: #5CC98E; --neg: #F27A70; --warn: #E9A846; --warn-soft: #3A2C14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.neg { color: var(--neg); } .pos { color: var(--pos); }
.muted { color: var(--muted); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--display); font-size: 19px; letter-spacing: -0.01em; }
.brand b span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 12.5px; }
.ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.ctrl select { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 11px; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* Tabs */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 11px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; color: var(--muted); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.tab[disabled] { cursor: default; opacity: .55; }
.tab .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.soon { font-size: 10.5px; border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; }

main { padding-block: 20px 48px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-family: var(--display); font-size: 24px; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.mirror { font-size: 12.5px; color: var(--muted); }
.mirror b { color: var(--ink); font-weight: 500; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
@media (max-width: 900px) { .kpis { grid-template-columns: 1fr 1fr; } .kpis > :first-child { grid-column: 1 / -1; } }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; margin-top: 2px; letter-spacing: -0.02em; }
.kpi:first-child .v { font-size: 28px; }
.kpi .s { font-size: 12.5px; margin-top: 2px; }
.kpi.warn .v { color: var(--warn); }

/* Panels */
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel + .panel, .stack > .panel + .panel { margin-top: 18px; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ph h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
.ph .sub { font-size: 12.5px; color: var(--muted); }
.pb { padding: 14px 16px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--raised); }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; white-space: nowrap; }
.stack { min-width: 0; }
tr.grp td { background: var(--raised); font-weight: 600; }
tr.tot td { font-weight: 600; border-top: 2px solid var(--ink); background: var(--surface); }
.acct { font-family: var(--mono); font-size: 12px; }
.iban { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.unc { background: var(--warn-soft); color: var(--warn); }
.chip.fmt { background: var(--raised); color: var(--ink); border: 1px solid var(--line); font-family: var(--mono); }
.ok { color: var(--pos); font-weight: 500; }
.bad { color: var(--neg); font-weight: 500; }
.btc { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.rem { max-width: 340px; }
.rem .c { font-weight: 500; }
.rem .t { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font: 11px var(--mono); }
.chart .ln { stroke: var(--accent); stroke-width: 2; fill: none; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .dt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .lbl { fill: var(--ink); font: 500 12px var(--mono); }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding: 0 16px 12px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* Controls row */
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--raised); }
.filters select, .filters input { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; font-size: 13px; min-width: 0; }
.filters input { flex: 1 1 200px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 11px; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }

/* Import */
.drop { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.msg { margin-top: 10px; font-size: 13px; }
pre.raw { margin: 0; max-height: 360px; overflow: auto; font: 11.5px/1.5 var(--mono); background: var(--raised); padding: 12px 16px; border-top: 1px solid var(--line); white-space: pre; }

/* Learn */
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); }
.learn > div { background: var(--surface); padding: 14px 16px; }
.learn h3 { margin: 0 0 4px; font-size: 13.5px; }
.learn h3 i { font-style: normal; color: var(--accent); font-weight: 500; }
.learn p { margin: 0; color: var(--muted); font-size: 13px; }
details.rules summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary::after { content: "+"; color: var(--accent); }
details.rules[open] summary::after { content: "−"; }
details.rules[open] summary { border-bottom: 1px solid var(--line); }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); }
.loading { padding: 40px; text-align: center; color: var(--muted); }
table.fc td, table.fc th { padding: 6px 8px; }
table.fc td:first-child, table.fc th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 200px; }
table.fc tr.grp td:first-child { background: var(--raised); }
tr.catrow td:first-child { font-weight: 500; }
tr.subrow td { color: var(--muted); font-size: 12.5px; }
tr.subrow td:first-child { padding-left: 22px; }
td.warnc { color: var(--warn); background: var(--warn-soft); }
.chart .buf { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 6 4; }
.chart .bufl { fill: var(--warn); }
.chart .ln2 { stroke: var(--muted); stroke-width: 1.8; fill: none; }
.chart .barF { fill: var(--line); stroke: var(--muted); stroke-width: .5; }
.chart .barA { fill: var(--accent); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; }
.swF { background: var(--line); border: 1px solid var(--muted); } .swA { background: var(--accent); }
.pool { display: grid; grid-template-columns: 1.1fr auto 1fr 1.1fr; gap: 16px; align-items: center; }
@media (max-width: 1000px) { .pool { grid-template-columns: 1fr; } .parrow { flex-direction: row !important; justify-content: center; } }
.pcol { display: grid; gap: 10px; min-width: 0; }
.pcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--raised); min-width: 0; }
.pcard.hdr { border: 2px solid var(--accent); background: var(--accent-soft); }
.pcard.out { background: var(--surface); border-style: dashed; }
.pt { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.parrow { display: flex; flex-direction: column; gap: 8px; color: var(--accent); font-size: 12.5px; font-weight: 500; text-align: center; white-space: nowrap; }
.segbar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; gap: 2px; }
.b1 { background: var(--muted); } .b2 { background: var(--warn); } .b3 { background: var(--accent); }
.seglg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; font-size: 13px; }
@media (max-width: 700px) { .seglg { grid-template-columns: 1fr; } }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.expo { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; margin-bottom: 6px; }
.expo .track { position: relative; height: 8px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; }
.expo .track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.expo .track b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn); }
.occ { padding: 14px 16px; border-bottom: 1px solid var(--line); } .occ:last-child { border-bottom: 0; }
.occ h3 { margin: 0 0 4px; font-size: 13.5px; } .occ p { margin: 0; color: var(--muted); font-size: 13px; }
@media (max-width: 700px) { .pb[style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; } }
.wbar { height: 7px; background: var(--raised); border-radius: 3px; overflow: hidden; margin: 3px 0; }
.wbar i { display: block; height: 100%; background: var(--accent); } .wbar.c i { background: var(--muted); }
ul.agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--raised); }
tr.detail td { background: var(--accent-soft); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Treasury<span>OS</span></b><small data-i18n="tagline">Groupe Lumen · fictional group, synthetic data</small></div>
    <label class="ctrl" for="asof"><span data-i18n="asof">Position date</span>
      <select id="asof"></select>

</nav>

<main class="wrap" id="app"><div class="loading" data-i18n="loading">Reading bank statements…</div></main>

const S = { view: 'm1', glD: '', glQ: '', lang: 'en', asof: null, groupBy: 'entity', page: 0, fAcc: '', fCat: '', q: '', open: null, overrides: {} };

try { S.overrides = JSON.parse(localStorage.getItem('tos-overrides') || '{}'); } catch (e) {}
const t = (k, v = {}) => (T[S.lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const loc = () => (S.lang === 'fr' ? 'fr-FR' : 'en-GB');
const fmt = (x, d = 0) => new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(x);
const fmtM = x => fmt(x / 1e6, 2);
const mU = () => (S.lang === 'fr' ? '\u00a0M' : 'm');
const fM = x => fmtM(x) + mU();
const fdate = s => new Date(s + 'T12:00:00').toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: 'numeric' });
const fdShort = s => new Date(s + 'T12:00:00').toLocaleDateString(loc(), { day: '2-digit', month: 'short' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------------------------------------ parsers */
function parseCamt053(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('xml');
  const kids = (el, name) => Array.from(el.children).filter(c => c.localName === name);
  const one = (el, path) => path.split('/').reduce((n, p) => n && kids(n, p)[0], el);
  const txt = (el, path) => { const n = one(el, path); return n ? n.textContent.trim() : ''; };
  const signed = (el) => { const v = parseFloat(txt(el, 'Amt')); return txt(el, 'CdtDbtInd') === 'DBIT' ? -v : v; };
  const root = one(doc.documentElement, 'BkToCstmrStmt');
  if (!root) throw new Error('camt');
  return kids(root, 'Stmt').map(st => {
    const bals = kids(st, 'Bal');
    const bal = code => { const b = bals.find(x => txt(x, 'Tp/CdOrPrtry/Cd') === code); return b ? signed(b) : null; };
    const date = txt(bals[0], 'Dt/Dt');
    return {
      iban: txt(st, 'Acct/Id/IBAN'), ccy: txt(st, 'Acct/Ccy'), date, opening: bal('OPBD'), closing: bal('CLBD'),
      entries: kids(st, 'Ntry').map(n => {
        const tx = one(n, 'NtryDtls/TxDtls');
        const dom = one(n, 'BkTxCd/Domn');
        return {
          booking: txt(n, 'BookgDt/Dt'), value: txt(n, 'ValDt/Dt'), amount: signed(n),
          btc: dom ? [txt(dom, 'Cd'), txt(dom, 'Fmly/Cd'), txt(dom, 'Fmly/SubFmlyCd')].join('-') : '',
          ref: txt(n, 'AcctSvcrRef'), e2e: tx ? txt(tx, 'Refs/EndToEndId') : '',
          cpty: tx ? (txt(tx, 'RltdPties/Dbtr/Pty/Nm') || txt(tx, 'RltdPties/Cdtr/Pty/Nm')) : '',
          info: tx ? txt(tx, 'RmtInf/Ustrd') : ''
        };
      })
    };
  });
}

function parseMT940(text) {
  // Join continuation lines onto the tag they belong to, then walk the tags.
  const lines = text.replace(/\r/g, '').split('\n');
  const tags = []; let cur = null;
  for (const raw of lines) {
    const m = raw.match(/^:(\d{2}[A-Z]?):(.*)$/);
    if (m) { cur = { tag: m[1], val: m[2] }; tags.push(cur); }
    else if (raw.trim() === '-') { tags.push({ tag: 'END' }); cur = null; }
    else if (cur) cur.val += raw;
  }
  const amt = s => parseFloat(s.replace(',', '.'));
  const d6 = s => `20${s.slice(0, 2)}-${s.slice(2, 4)}-${s.slice(4, 6)}`;
  const bal = v => { const m = v.match(/^([CD])(\d{6})([A-Z]{3})([\d,]+)/); return { amt: (m[1] === 'D' ? -1 : 1) * amt(m[4]), date: d6(m[2]), ccy: m[3] }; };
  const out = []; let st = null, last = null;
  for (const x of tags) {
    if (x.tag === '20') { st = { entries: [] }; }
    else if (!st) continue;
    else if (x.tag === '25') st.iban = x.val.split('/').pop().trim();
    else if (x.tag === '60F' || x.tag === '60M') { const b = bal(x.val); st.opening = b.amt; st.ccy = b.ccy; st.date = b.date; }
    else if (x.tag === '61') {
      // value date YYMMDD, optional entry date MMDD, C/D (or RC/RD), amount, type code, references
      const m = x.val.match(/^(\d{6})(\d{4})?(R?[CD])([\d,]+)([NF][A-Z0-9]{3})([^/]*)(?:\/\/(.*))?$/);
      if (!m) continue;
      const value = d6(m[1]);
      const booking = m[2] ? `${value.slice(0, 4)}-${m[2].slice(0, 2)}-${m[2].slice(2)}` : value;
      last = { booking, value, amount: (m[3].endsWith('D') ? -1 : 1) * amt(m[4]), swift: m[5], ref: (m[7] || '').trim(), e2e: m[6].trim(), cpty: '', info: '', btc: '' };
      st.entries.push(last);
    }
    else if (x.tag === '86' && last) {
      const f = {}; x.val.replace(/\/(NAME|REMI|BTC|EREF)\/(.*?)(?=\/(?:NAME|REMI|BTC|EREF)\/|$)/g, (_, k, v) => { f[k] = v.trim(); });
      last.cpty = f.NAME || ''; last.info = f.REMI || x.val; last.btc = f.BTC || ''; if (f.EREF) last.e2e = f.EREF;
    }
    else if (x.tag === '62F') { st.closing = bal(x.val).amt; }
    else if (x.tag === 'END') { out.push(st); st = null; last = null; }
  }
  if (st) out.push(st);
  return out;
}

function parseStatement(text) {
  const s = text.trimStart();
  if (s.startsWith('<')) return { format: 'camt.053', statements: parseCamt053(text) };
  if (/^:20:|\n:20:/.test(s)) return { format: 'MT940', statements: parseMT940(text) };
  throw new Error('unknown');
}

/* ------------------------------------------------------------ engine */
let D = {};     // reference data
let FILES = []; // imported files
let LINES = []; // every bank line, categorised
let BAL = {};   // BAL[accountId][date] = closing balance

function categorise(line) {
  if (S.overrides[line.key]) return { cat: S.overrides[line.key], rule: 'manual' };
  const text = (line.cpty + ' ' + line.info).toUpperCase();
  for (const r of D.rules) {
    if (r.if_btc && r.if_btc !== line.btc) continue;
    if (r.if_btc_family && line.btc.split('-')[1] !== r.if_btc_family) continue;
    if (r.if_sign && ((line.amount > 0) !== (r.if_sign === '+'))) continue;
    if (r.if_text && !new RegExp(r.if_text, 'i').test(text)) continue;
    return { cat: r.category, rule: r.priority };
  }
  return { cat: 'UNC', rule: null };
}

function rebuild() {
  LINES = []; BAL = {};
  for (const f of FILES) {
    for (const st of f.statements) {
      const acc = D.byIban[st.iban];
      if (!acc) continue;
      (BAL[acc.id] ||= {})[st.date] = st.closing;
      st.entries.forEach((e, i) => {
        const line = { ...e, account: acc.id, entity: acc.entity, bank: acc.bank, ccy: acc.ccy, key: `${acc.id}|${st.date}|${i}|${e.amount}` };
        Object.assign(line, categorise(line));
        LINES.push(line);
      });
    }
  }
  LINES.sort((a, b) => b.booking.localeCompare(a.booking) || a.account.localeCompare(b.account));
  D.days = [...new Set(Object.values(BAL).flatMap(o => Object.keys(o)))].sort();
  if (!S.asof || !D.days.includes(S.asof)) S.asof = D.days[D.days.length - 1];
}

function checkFile(f) {
  let ok = true, prev = null;
  for (const st of f.statements) {
    const sum = st.entries.reduce((s, e) => s + e.amount, 0);
    if (Math.abs(st.opening + sum - st.closing) > 0.005) ok = false;
    if (prev !== null && Math.abs(prev - st.opening) > 0.005) ok = false;
    prev = st.closing;
  }
  return ok;
}

function rate(date, ccy) {
  if (ccy === 'EUR') return 1;
  let i = D.fxDates.length - 1;
  while (i > 0 && D.fxDates[i] > date) i--;
  return D.fx[D.fxDates[i]]['EUR' + ccy];
}
function balanceOn(accId, date) {
  const b = BAL[accId] || {};
  const ds = Object.keys(b).filter(d => d <= date).sort();
  return ds.length ? b[ds[ds.length - 1]] : null;
}
function prevDay(date) { const i = D.days.indexOf(date); return i > 0 ? D.days[i - 1] : null; }
function groupCash(date) {
  return D.accounts.reduce((s, a) => { const b = balanceOn(a.id, date); return s + (b == null ? 0 : b / rate(date, a.ccy)); }, 0);
}

/* ------------------------------------------------------------ views */
function catLabel(id) { const c = D.catById[id]; return c ? c[S.lang] : id; }

function viewKpis() {
  const cash = groupCash(S.asof), p = prevDay(S.asof), chg = p ? cash - groupCash(p) : 0;
  const reporting = D.accounts.filter(a => balanceOn(a.id, S.asof) != null).length;
  const auto = LINES.filter(l => l.rule !== null && l.rule !== 'manual').length;
  const rev = LINES.filter(l => l.cat === 'UNC').length;
  return `<section class="kpis">
    <div class="kpi"><div class="l">${t('kCash')} · ${fdate(S.asof)}</div><div class="v">EUR ${fmt(cash)}</div>
      <div class="s ${chg < 0 ? 'neg' : 'pos'}">${chg < 0 ? '' : '+'}${fmt(chg)} ${t('kVsPrev')}</div></div>
    <div class="kpi"><div class="l">${t('kAcc')}</div><div class="v">${reporting}/${D.accounts.length}</div><div class="s muted">3 ${t('kAccS')}</div></div>
    <div class="kpi"><div class="l">${t('kLines')}</div><div class="v">${fmt(LINES.length)}</div><div class="s muted">${t('kLinesS')}</div></div>
    <div class="kpi"><div class="l">${t('kAuto')}</div><div class="v">${fmt(100 * auto / LINES.length, 1)}%</div><div class="s muted">${t('kAutoS')}</div></div>
    <div class="kpi ${rev ? 'warn' : ''}"><div class="l">${t('kRev')}</div><div class="v">${rev}</div><div class="s muted">${t('kRevS')}</div></div>
  </section>`;
}

function viewPosition() {
  const p = prevDay(S.asof);
  const rows = D.accounts.map(a => {
    const b = balanceOn(a.id, S.asof) ?? 0, r = rate(S.asof, a.ccy), eur = b / r;
    const pb = p ? (balanceOn(a.id, p) ?? 0) / rate(p, a.ccy) : eur;
    return { a, b, r, eur, chg: eur - pb };
  });
  const total = rows.reduce((s, x) => s + x.eur, 0), totChg = rows.reduce((s, x) => s + x.chg, 0);
  const key = { entity: x => x.a.entity, bank: x => x.a.bank, currency: x => x.a.ccy }[S.groupBy];
  const label = { entity: k => D.entById[k].name, bank: k => D.bankById[k].name, currency: k => k }[S.groupBy];
  const groups = [...new Set(rows.map(key))];
  let body = '';
  for (const g of groups) {
    const rs = rows.filter(x => key(x) === g), ge = rs.reduce((s, x) => s + x.eur, 0), gc = rs.reduce((s, x) => s + x.chg, 0);
    const sameCcy = new Set(rs.map(x => x.a.ccy)).size === 1;
    body += `<tr class="grp"><td>${esc(label(g))}</td><td></td><td class="r num">${sameCcy && S.groupBy === 'currency' ? fmt(rs.reduce((s, x) => s + x.b, 0)) : ''}</td><td></td>
      <td class="r num">${fmt(ge)}</td><td class="r num ${gc < 0 ? 'neg' : ''}">${fmt(gc)}</td><td class="r num">${fmt(100 * ge / total, 1)}%</td></tr>`;
    for (const x of rs) {
      body += `<tr><td><div class="acct">${x.a.id}</div><div class="iban">${x.a.iban.replace(/(.{4})/g, '$1 ').trim()}</div></td>
        <td>${esc(D.bankById[x.a.bank].name)}</td>
        <td class="r num">${x.a.ccy} ${fmt(x.b)}</td>
        <td class="r num muted">${x.a.ccy === 'EUR' ? '' : fmt(x.r, 4)}</td>
        <td class="r num">${fmt(x.eur)}</td>
        <td class="r num ${x.chg < 0 ? 'neg' : ''}">${fmt(x.chg)}</td>
        <td class="r num muted">${fmt(100 * x.eur / total, 1)}%</td></tr>`;
    }
  }
  body += `<tr class="tot"><td>${t('total')}</td><td></td><td></td><td></td><td class="r num">${fmt(total)}</td><td class="r num ${totChg < 0 ? 'neg' : ''}">${fmt(totChg)}</td><td class="r num">100%</td></tr>`;
  const segBtn = (v, k) => `<button data-group="${v}" aria-pressed="${S.groupBy === v}">${t(k)}</button>`;
  return `<section class="panel">
    <div class="ph"><div><h2>${t('posTitle')}</h2><div class="sub">${t('posSub')}</div></div>
      <div class="ctrl"><span>${t('by')}</span><div class="seg">${segBtn('entity', 'byEntity')}${segBtn('bank', 'byBank')}${segBtn('currency', 'byCcy')}</div></div></div>
    <div class="scroll"><table>
      <thead><tr><th>${t('thAccount')}</th><th>${t('thBank')}</th><th class="r">${t('thBal')}</th><th class="r">${t('thRate')}</th><th class="r">${t('thEur')}</th><th class="r">${t('thChg')}</th><th class="r">${t('thShare')}</th></tr></thead>
      <tbody>${body}</tbody></table></div></section>`;
}

function viewChart() {
  const pts = D.days.map(d => ({ d, v: groupCash(d) / 1e6 }));
  const W = 640, H = 230, L = 44, R = 64, Tp = 14, B = 26;
  const lo = Math.floor(Math.min(...pts.map(p => p.v)) - 0.5), hi = Math.ceil(Math.max(...pts.map(p => p.v)) + 0.5);
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
  const step = (hi - lo) > 8 ? 2 : 1;
  let grid = '';
  for (let v = lo; v <= hi; v += step) grid += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  pts.forEach((p, i) => { if (new Date(p.d + 'T12:00:00').getDay() === 1 && i % 10 < 5 && i > 0 && i < pts.length - 2) grid += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${fdShort(p.d)}</text>`; });
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${path}L${x(pts.length - 1)},${y(lo)}L${x(0)},${y(lo)}Z`;
  const si = pts.findIndex(p => p.d === S.asof), sp = pts[si];
  return `<section class="panel chart">
    <div class="ph"><div><h2>${t('chartTitle')}</h2><div class="sub">${t('chartSub')}</div></div></div>
    <div class="pb"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartTitle')}">${grid}
      <path class="ar" d="${area}"/><path class="ln" d="${path}"/>
      <circle class="dt" cx="${x(si)}" cy="${y(sp.v)}" r="5"/>
      <text class="lbl" x="${Math.min(x(si) + 9, W - 4)}" y="${y(sp.v) - 9}" text-anchor="${si > pts.length - 6 ? 'end' : 'start'}">${fmt(sp.v, 1)}${mU()}</text>
    </svg></div></section>`;
}

      <input type="file" id="file" accept=".xml,.sta,.txt,.940,.mt940" hidden></div><div class="msg" id="impmsg">${S.impMsg || ''}</div></div>
  </section>`;
}

function filtered() {

function viewLines() {

async function importFile(f) {
  const text = await f.text();
  try {
    const p = parseStatement(text);
    if (!p.statements.length) throw new Error('empty');
    const iban = p.statements[0].iban, acc = D.byIban[iban];
    if (!acc) { S.impMsg = `<span class="bad">${esc(t('impUnknown', { i: iban }))}</span>`; render(); return; }
    // Replace statements for the same account and dates, keep the rest.
    const dates = new Set(p.statements.map(s => s.date));
    FILES.forEach(x => { x.statements = x.statements.filter(s => !(s.iban === iban && dates.has(s.date))); });
    FILES = FILES.filter(x => x.statements.length);
    FILES.push({ name: f.name, format: p.format, statements: p.statements, text });
    S.impMsg = `<span class="ok">${esc(t('impOk', { n: p.statements.length, l: p.statements.reduce((s, x) => s + x.entries.length, 0), a: acc.id }))}</span>`;
    rebuild(); S.asof = D.days[D.days.length - 1]; render();
  } catch (e) { S.impMsg = `<span class="bad">${t('impFail')}</span>`; render(); }
}

/* ---------------- calendar helpers (ISO dates as strings, UTC maths) */
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
let HOL = new Set();
const isBD = iso => { const w = new Date(iso + 'T00:00:00Z').getUTCDay(); return w !== 0 && w !== 6 && !HOL.has(iso); };
const nextBD = iso => { while (!isBD(iso)) iso = addDays(iso, 1); return iso; };
const prevBD = iso => { while (!isBD(iso)) iso = addDays(iso, -1); return iso; };
function monthEnd(y, m) { const d = new Date(Date.UTC(y, m, 0)); return d.toISOString().slice(0, 10); }  // m is 1-12
const isoWeek = iso => { const d = new Date(iso + 'T00:00:00Z'); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3); const fy = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - fy) / 864e5 - 3 + ((fy.getUTCDay() + 6) % 7)) / 7); };
const mondayOf = iso => { const d = new Date(iso + 'T00:00:00Z'); return addDays(iso, -((d.getUTCDay() + 6) % 7)); };
function bdCount(a, b) { let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) if (isBD(d)) n++; return n; }
function parseCSV(text) {
  const [h, ...rows] = text.trim().split(/\r?\n/); const cols = h.split(',');
  return rows.map(r => { const v = r.split(','); return Object.fromEntries(cols.map((c, i) => [c, isNaN(+v[i]) || v[i] === '' ? v[i] : +v[i]])); });
}

/* expand one calendar item into dated occurrences between a and b (inclusive) */
function occurrences(item, a, b) {
  const out = [];
  if (item.dates) { item.dates.forEach(d => { const x = nextBD(d); if (x >= a && x <= b) out.push({ date: x, factor: 1 }); }); return out; }
  let y = +a.slice(0, 4), m = +a.slice(5, 7) - 1;  // start a month early to catch rolled dates
  if (m === 0) { y--; m = 12; }
  for (let i = 0; i < 16; i++) {
    const me = monthEnd(y, m);
    const raw = `${y}-${String(m).padStart(2, '0')}-${String(Math.min(item.day === 'last' ? 31 : item.day, +me.slice(8))).padStart(2, '0')}`;
    const d = item.day === 'last' || item.roll === 'prev' ? prevBD(raw) : nextBD(raw);
    if (d >= a && d <= b) out.push({ date: d, factor: (item.months_factor && item.months_factor[String(m)]) || 1 });
    m++; if (m > 12) { m = 1; y++; }
    if (`${y}-${String(m).padStart(2, '0')}-01` > b) break;
  }
  return out;
}

/* ---------------- run-rates from the 13 weeks of actual bank lines */
function runRates() {
  const rr = {};
  const weeks = D.days.length / 5;
  for (const l of LINES) {
    const k = l.entity + '|' + l.ccy;
    rr[k] ||= { CUST: 0, SUPP: 0 };
    if (l.cat === 'CUST') rr[k].CUST += l.amount;
    if (l.cat === 'SUPP' && l.btc.split('-')[1] === 'ICDT') rr[k].SUPP += l.amount;
  }
  for (const k in rr) { rr[k].CUST /= weeks; rr[k].SUPP /= weeks; }
  return rr;
}

/* ---------------- the 13-week forecast */
function forecast13(f) {
  const st = D.fs.forecast_start, N = D.fs.weeks, end = addDays(st, 7 * N - 1), asof = D.fs.as_of;
  const weeks = [...Array(N)].map((_, i) => addDays(st, 7 * i));
  const wi = iso => { const i = Math.floor((Date.parse(iso) - Date.parse(st)) / 6048e5); return i >= 0 && i < N ? i : -1; };
  const season = i => D.fs.week_season[weeks[i]] || 1;
  const spot = ccy => rate(asof, ccy);
  const lines = {};
  const put = (entity, ccy, cat, src, i, amt, label) => {
    if (i < 0) return;
    const k = [entity, ccy, cat, src].join('|');
    lines[k] ||= { entity, ccy, cat, src, label, vals: Array(N).fill(0) };
    lines[k].vals[i] += amt;
  };
  // 1. open receivables: due date + delay, times probability, times (1 - haircut)
  const arWeek = {};
  for (const r of D.ar) {
    const d = nextBD(addDays(r.due_date, f.delay)), i = wi(d);
    const amt = r.amount * r.probability_pct / 100 * (1 - f.haircut / 100);
    put(r.entity, r.currency, 'CUST', 'AR', i, amt);
    if (i >= 0) { const k = r.entity + '|' + r.currency; (arWeek[k] ||= Array(N).fill(0))[i] += amt; }
  }
  // 2. sales not invoiced yet: run-rate minus what open invoices already cover
  const rr = runRates();
  if (f.uninv) for (const k in rr) {
    const [entity, ccy] = k.split('|');
    for (let i = 0; i < N; i++) {
      const target = rr[k].CUST * season(i) * (1 - f.haircut / 100);
      const shift = Math.round(f.delay / 7);  // later payment also pushes the run-rate out
      if (i - shift < 0) continue;
      const covered = (arWeek[k] || [])[i] || 0;
      put(entity, ccy, 'CUST', 'EST', i, Math.max(0, target - covered));
    }
  }
  // 3. open payables (8 weeks known), then the supplier run-rate
  const apH = D.fs.ap_horizon_weeks;
  for (const p of D.ap) {
    const i = wi(nextBD(p.due_date));
    if (i < 0 || i >= apH) continue;
    let amt = -p.amount, ccy = p.currency;
    if (p.entity === 'LUM-MA' && ccy === 'USD') { amt = amt / spot('USD') * spot('MAD'); ccy = 'MAD'; }
    put(p.entity, ccy, 'SUPP', 'AP', i, amt);
  }
  for (const k in rr) {
    const [entity, ccy] = k.split('|');
    for (let i = apH; i < N; i++) put(entity, ccy, 'SUPP', 'APE', i, rr[k].SUPP * season(i));
  }
  // 4. known schedule (calendar): payroll, social charges, taxes, rent, intercompany, interest
  for (const c of D.cal) {
    for (const o of occurrences(c, st, end)) {
      let amt = c.amount * o.factor;
      if ((c.cat === 'PAYR' || c.cat === 'SOCL')) amt *= 1 + f.payroll / 100;
      put(c.entity, c.ccy, c.cat, 'CAL', wi(o.date), amt, c[S.lang]);
    }
  }
  // EUR conversion at spot
  const out = Object.values(lines).map(l => ({ ...l, eur: l.vals.map(v => v / spot(l.ccy)) }));
  // opening cash by entity bucket and for the group
  const open = groupCash(asof);
  const net = [...Array(N)].map((_, i) => out.reduce((s, l) => s + l.eur[i], 0));
  const close = []; net.reduce((c, n, i) => (close[i] = c + n), open);
  return { weeks, lines: out, open, net, close };
}

/* ---------------- forecast vs actual */
function variance(scope) {
  const snap = D.snap.filter(r => scope === 'GROUP' || r.entity === scope);
  const act = {}, fc = {};
  for (const l of LINES) {
    if (l.cat === 'POOL' || (scope !== 'GROUP' && l.entity !== scope)) continue;
    const k = mondayOf(l.booking) + '|' + l.cat;
    act[k] = (act[k] || 0) + l.amount / rate(l.booking, l.ccy);
  }
  for (const r of snap) { const k = r.week_start + '|' + r.category; fc[k] = (fc[k] || 0) + r.forecast_eur; }
  const keys = new Set([...Object.keys(act), ...Object.keys(fc)]);
  const byCat = {}, byWeek = {};
  let absVar = 0, absAct = 0;
  const cells = [];
  for (const k of keys) {
    const [w, c] = k.split('|'), a = act[k] || 0, fv = fc[k] || 0;
    (byCat[c] ||= { f: 0, a: 0, absv: 0 }); byCat[c].f += fv; byCat[c].a += a; byCat[c].absv += Math.abs(a - fv);
    (byWeek[w] ||= { f: 0, a: 0 }); byWeek[w].f += fv; byWeek[w].a += a;
    absVar += Math.abs(a - fv); absAct += Math.abs(a);
    cells.push({ w, c, a, f: fv, v: a - fv });
  }
  const cause = (c, x) => {
    if (Math.abs(x.f) < 1 && Math.abs(x.a) > 1) return 'cNot';
    if (x.absv < 0.03 * Math.abs(x.a)) return 'cOk';
    return Math.abs(x.a - x.f) < 0.4 * x.absv ? 'cTim' : 'cVol';
  };
  for (const c in byCat) byCat[c].cause = cause(c, byCat[c]);
  // A miss is timing when the next or previous week of the same category shows the opposite variance.
  const cellAt = (w, c) => cells.find(x => x.w === w && x.c === c);
  const causeOf = m => {
    if (Math.abs(m.f) < 1) return 'cNot';
    const adj = [cellAt(addDays(m.w, 7), m.c), cellAt(addDays(m.w, -7), m.c)].filter(Boolean);
    return adj.some(x => Math.sign(x.v) === -Math.sign(m.v) && Math.abs(x.v) > 0.5 * Math.abs(m.v)) ? 'cTim' : 'cVol';
  };
  const ranked = cells.slice().sort((p, q) => Math.abs(q.v) - Math.abs(p.v));
  const misses = ranked.slice(0, 4).map(m => ({ ...m, cause: causeOf(m) }));
  const notF = ranked.find(m => Math.abs(m.f) < 1 && Math.abs(m.a) > 1000);
  if (notF && !misses.some(m => m === notF)) misses.push({ ...notF, cause: 'cNot' });
  const tim = ranked.find(m => causeOf(m) === 'cTim');
  if (tim && !misses.some(m => m.w === tim.w && m.c === tim.c)) misses.push({ ...tim, cause: 'cTim' });
  return { byCat, byWeek, acc: 1 - absVar / absAct, misses };
}

/* ---------------- 12-month forecast (group, EUR) */
function forecast12(f) {
  const m12 = D.fs.m12, st = D.fs.forecast_start, rr = runRates();
  const rrEur = Object.entries(rr).reduce((s, [k, v]) => { const ccy = k.split('|')[1], r = rate(D.fs.as_of, ccy); s.CUST += v.CUST / r; s.SUPP += v.SUPP / r; return s; }, { CUST: 0, SUPP: 0 });
  const cats = {};
  const add = (cat, i, v) => { (cats[cat] ||= Array(12).fill(0))[i] += v; };
  m12.months.forEach((ym, i) => {
    const y = +ym.slice(0, 4), m = +ym.slice(5);
    const a = i === 0 ? st : ym + '-01', b = monthEnd(y, m);
    const wks = bdCount(a, b) / 5, g = Math.pow(1 + m12.activity_growth_pct / 100, i / 12), s = m12.seasonality[ym.slice(5)] || 1;
    add('CUST', i, rrEur.CUST * wks * s * g * (1 - f.haircut / 100));
    add('SUPP', i, rrEur.SUPP * wks * s * g);
    for (const c of D.cal) for (const o of occurrences(c, a, b)) {
      let v = c.amount * o.factor / rate(D.fs.as_of, c.ccy);
      if (c.cat === 'PAYR' || c.cat === 'SOCL') v *= 1 + f.payroll / 100;
      add(c.cat, i, v);
    }
    for (const x of m12.one_offs) if (x.month === ym) add(x.cat, i, x.amount_eur);
  });
  const net = [...Array(12)].map((_, i) => Object.values(cats).reduce((s, a) => s + a[i], 0));
  const close = []; net.reduce((c, n, i) => (close[i] = c + n), groupCash(D.fs.as_of));
  return { months: m12.months, cats, net, close };
}

function viewF13(fc) {
  const N = fc.weeks.length, grp = F.scope === 'GROUP';
  const lines = fc.lines.filter(l => grp || l.entity === F.scope);
  const sum = (arr) => [...Array(N)].map((_, i) => arr.reduce((s, l) => s + l.eur[i], 0));
  const pol = D.fs.liquidity_policy, undrawn = pol.rcf_commitment_eur - pol.rcf_drawn_eur;
  const cell = (v, cls = '') => `<td class="r num ${v < -0.5 ? 'neg' : ''} ${cls}">${Math.abs(v) < 500 ? '–' : kE(v)}</td>`;
  const row = (label, vals, cls = '', lead = '') => `<tr class="${cls}"><td>${lead}${label}</td>${vals.map(v => cell(v)).join('')}${cell(vals.reduce((a, b) => a + b, 0))}</tr>`;
  let rows = '';
  const net = sum(lines);
  if (grp) rows += `<tr class="grp"><td>${t('rOpen')}</td>${[fc.open, ...fc.close.slice(0, -1)].map(v => `<td class="r num">${kE(v)}</td>`).join('')}<td></td></tr>`;
  const SRC = { AR: 'sAR', EST: 'sEst', AP: 'sAP', APE: 'sAPe', CAL: 'sCal' };
  for (const c of CAT_ORDER) {
    const ls = lines.filter(l => l.cat === c);
    if (!ls.length) continue;
    const tot = sum(ls);
    if (tot.every(v => Math.abs(v) < 1)) continue;
    rows += row(esc(catLabel(c)), tot, 'catrow');
    if (c === 'CUST' || c === 'SUPP') {
      const srcs = [...new Set(ls.map(l => l.src))];
      for (const s of srcs) rows += row(t(SRC[s]), sum(ls.filter(l => l.src === s)), 'subrow', '<span class="indent"></span>');
    }
  }
  rows += row(t('rNet'), net, 'grp');
  if (grp) {
    rows += `<tr class="tot"><td>${t('rClose')}</td>${fc.close.map(v => `<td class="r num ${v < pol.min_group_cash_eur ? 'warnc' : ''}">${kE(v)}</td>`).join('')}<td></td></tr>`;
    rows += `<tr class="subrow"><td>${t('rHead')}</td>${fc.close.map(v => `<td class="r num muted">${kE(v + undrawn - pol.min_group_cash_eur)}</td>`).join('')}<td></td></tr>`;
  }
  const head = fc.weeks.map(w => `<th class="r">${t('wk')}${isoWeek(w)}<div class="muted" style="font-weight:400">${fdShort(w)}</div></th>`).join('');
  return `${viewAssumptions()}
    <div style="margin-top:18px">${grp ? viewF13Chart(fc) : ''}</div>
    <section class="panel" style="margin-top:18px"><div class="ph"><div><h2>${t('fcTitle')}${grp ? '' : ' · ' + esc(D.entById[F.scope].name)}</h2><div class="sub">${grp ? t('fcSub') : t('fcSubEnt')}</div></div></div>
      <div class="scroll"><table class="fc"><thead><tr><th class="stick"></th>${head}<th class="r">${t('fTotal')}</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function viewF13Chart(fc) {
  const W = 1100, H = 280, L = 46, R = 16, Tp = 16, B = 30, N = fc.close.length;
  const pol = D.fs.liquidity_policy;
  const series = [{ name: t('base'), v: fc.close.map(x => x / 1e6), cls: 'ln' }, ...F.versions.map((v, i) => ({ name: v.name, v: v.close.map(x => x / 1e6), cls: 'ln2', dash: i }))];
  const all = series.flatMap(s => s.v).concat([pol.min_group_cash_eur / 1e6, fc.open / 1e6]);
  const lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1);
  const x = i => L + (W - L - R) * (i + 0.5) / N, y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
  const step = hi - lo > 12 ? 4 : hi - lo > 6 ? 2 : 1;
  let g = '';
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  fc.weeks.forEach((w, i) => { g += `<text class="ax" x="${x(i)}" y="${H - 10}" text-anchor="middle">${t('wk')}${isoWeek(w)}</text>`; });
  const yb = y(pol.min_group_cash_eur / 1e6);
  g += `<line x1="${L}" x2="${W - R}" y1="${yb}" y2="${yb}" class="buf"/><text class="ax bufl" x="${W - R - 4}" y="${yb - 6}" text-anchor="end">${t('buffer')} ${fmt(pol.min_group_cash_eur / 1e6, 0)}${mU()}</text>`;
  const lines = series.map((s, si) => `<path class="${s.cls}" ${si ? `stroke-dasharray="${4 + 3 * s.dash} 4"` : ''} d="${s.v.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}"/>`).join('');
  const dots = fc.close.map((v, i) => `<circle class="dt" cx="${x(i)}" cy="${y(v / 1e6)}" r="3.5"/>`).join('');
  const last = fc.close[N - 1] / 1e6;
  const legend = series.length > 1 ? `<div class="legend">${series.map((s, i) => `<span><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" class="${s.cls}" ${i ? `stroke-dasharray="${4 + 3 * s.dash} 4"` : ''}/></svg> ${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<section class="panel chart"><div class="ph"><div><h2>${t('chTitle')}</h2><div class="sub">${t('chSub')}</div></div></div>
    <div class="pb"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chTitle')}">${g}${lines}${dots}
    <text class="lbl" x="${x(N - 1) - 6}" y="${y(last) - 10}" text-anchor="end">${fmt(last, 1)}${mU()}</text></svg></div>${legend}</section>`;
}

  return `<section class="panel"><div class="ph"><div><h2>${t('vTitle')}</h2><div class="sub">${t('vSub')}</div></div>

        <div class="pb muted" style="font-size:12.5px">${t('accHelp')}</div></div>
      <div class="chart" style="border-left:1px solid var(--line)"><div class="pb"><div class="sub" style="margin-bottom:6px;font-size:12.5px;color:var(--muted)">${t('vChart')}</div>

/* ---------------- engine */
function poolCalc() {
  const P = D.pool, ir = P.interest;
  const res = {};
  for (const p of P.pool.participants) {
    const sw = {};
    for (const l of LINES) if (l.account === p.account && l.btc === 'CAMT-ACCB-ZABA') sw[l.booking] = (sw[l.booking] || 0) + l.amount;
    let pos = p.opening_position_eur, up = 0, down = 0;
    const series = D.days.map(d => { const a = sw[d] || 0; if (a < 0) up -= a; else down += a; pos -= a; return { d, sweep: a, pos }; });
    // interest per calendar day on the last end-of-day position
    const months = {};
    let i = 0, total = 0;
    for (let d = D.days[0]; d <= D.days[D.days.length - 1]; d = addDays(d, 1)) {
      while (i + 1 < series.length && series[i + 1].d <= d) i++;
      const ps = series[i].pos, rate = ir.reference_rate_pct + (ps >= 0 ? ir.credit_margin_pct : ir.debit_margin_pct);
      const int = ps * rate / 100 / ir.basis_days;
      const m = d.slice(0, 7);
      (months[m] ||= { days: 0, sumPos: 0, int: 0 });
      months[m].days++; months[m].sumPos += ps; months[m].int += int; total += int;
    }
    res[p.account] = { ...p, series, up, down, months, total, pos: series[series.length - 1].pos };
  }
  return res;
}

function surplusCalc() {
  const P = D.pool, pol = P.policy, fc = forecast13(F), cash = groupCash(D.fs.as_of);
  const low = Math.min(...fc.close), buffer = pol.min_group_cash_eur;
  const invest = Math.max(0, Math.min(low, cash) - buffer);
  const reserve = Math.max(0, cash - buffer - invest);
  const alloc = P.instruments.map(x => ({ ...x, amount: Math.round(invest * x.share / 1000) * 1000 }));
  alloc.forEach(a => { a.income = a.amount * a.rate_pct / 100 * a.days / 360; });
  // bank exposure after placement: the surplus leaves the header account
  const byBank = {};
  for (const a of D.accounts) { const b = balanceOn(a.id, D.fs.as_of) / rate(D.fs.as_of, a.ccy); byBank[a.bank] = (byBank[a.bank] || 0) + b; }
  byBank[D.bankById[D.accounts.find(a => a.id === P.pool.header).bank].id] -= invest;
  let fund = 0;
  for (const a of alloc) { if (a.bank) byBank[a.bank] += a.amount; else fund += a.amount; }
  const total = Object.values(byBank).reduce((s, v) => s + v, 0) + fund;
  const liquid = alloc.filter(a => a.liquid_week).reduce((s, a) => s + a.amount, 0);
  return { cash, low, buffer, invest, reserve, alloc, byBank, fund, total, liquidShare: invest ? liquid / invest : 1, income: alloc.reduce((s, a) => s + a.income, 0) };
}

function viewIcChart(p) {
  const pts = p.series.map(s => s.pos / 1e6), W = 640, H = 220, L = 44, R = 60, Tp = 14, B = 26;
  const lo = Math.floor(Math.min(0, ...pts)), hi = Math.ceil(Math.max(...pts) + 0.5);
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi; v++) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  p.series.forEach((s, i) => { if (i % 15 === 0) g += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${fdShort(s.d)}</text>`; });
  const path = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const n = pts.length - 1;
  return `<section class="panel chart"><div class="ph"><div><h2>${t('icTitle')}</h2><div class="sub">${t('icSub')}</div></div></div>
    <div class="pb"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('icTitle')}">${g}<path class="ar" d="${path}L${x(n)},${y(lo)}L${x(0)},${y(lo)}Z"/><path class="ln" d="${path}"/>
    <circle class="dt" cx="${x(n)}" cy="${y(pts[n])}" r="5"/><text class="lbl" x="${x(n) + 8}" y="${y(pts[n]) + 4}">${fmt(pts[n], 2)}${mU()}</text></svg></div></section>`;
}

function viewSweeps(pc) {
  const rows = [];
  for (const k in pc) pc[k].series.forEach(s => { if (s.sweep) rows.push({ acc: k, ...s }); });
  rows.sort((a, b) => b.d.localeCompare(a.d) || a.acc.localeCompare(b.acc));
  return `<section class="panel"><div class="ph"><h2>${t('lastSw')}</h2></div><div class="scroll"><table>
    <thead><tr><th>${t('thDate')}</th><th>${t('thAccount')}</th><th>${t('sweep')}</th><th class="r">${t('thAmt')}</th><th class="r">${t('thCum')}</th></tr></thead>
    <tbody>${rows.slice(0, 10).map(r => `<tr><td class="num">${fdShort(r.d)}</td><td class="acct">${r.acc}</td><td><span class="chip ${r.sweep < 0 ? '' : 'unc'}">${r.sweep < 0 ? t('up') : t('down')}</span></td>
      <td class="r num">${fmt(Math.abs(r.sweep), 2)}</td><td class="r num muted">${pc[r.acc].intercompany ? fmt(r.pos) : '–'}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function viewInterest(p) {
  const ir = D.pool.interest, last = D.days[D.days.length - 1].slice(0, 7);
  const rows = Object.entries(p.months).map(([m, x]) => {
    const avg = x.sumPos / x.days, lend = avg >= 0, rate = ir.reference_rate_pct + (lend ? ir.credit_margin_pct : ir.debit_margin_pct);
    return `<tr><td>${fmMonth(m)}${m === last ? ` <span class="muted">(${t('mtd')})</span>` : ''}</td><td class="r num">${fmt(avg)}</td><td>${lend ? t('dirLend') : t('dirBorrow')}</td>

/* ---------------- engine */
const FEE_KEYS = ['account_maintenance_month', 'sepa_ct_out', 'sepa_ct_in', 'swift_out', 'ebics_month', 'cash_pool_month'];
function tariffEur(acc, tariff) {
  const v = D.rel.monthly_volumes[acc.id] || {};
  return tariff.account_maintenance_month + tariff.ebics_month + (acc.pool_role === 'header' ? tariff.cash_pool_month : 0)
    + (v.sepa_ct_in || 0) * tariff.sepa_ct_in + (v.sepa_ct_out || 0) * tariff.sepa_ct_out + (v.swift_out || 0) * tariff.swift_out + (v.other_eur || 0);
}
function relCalc() {
  const R = D.rel, bench = D.banks.fee_benchmark, fac = D.fac, asof = D.fs.as_of;
  // fee audit from FEES lines (excluding RCF charges)
  const inv = LINES.filter(l => l.cat === 'FEES' && !/RCF/.test(l.info || ''))
    .map(l => { const acc = D.accounts.find(a => a.id === l.account), billed = -l.amount / rate(l.booking, l.ccy), tariff = tariffEur(acc, D.bankById[acc.bank].fees);
      return { acc, d: l.booking, billed, tariff, gap: billed / tariff - 1, period: (l.info.match(/(\d{2}\/\d{4})/) || [])[1] || '' }; })
    .sort((a, b) => b.d.localeCompare(a.d) || a.acc.id.localeCompare(b.acc.id));
  const months = new Set(inv.map(i => i.period)).size || 1;
  const banks = {};
  for (const b of D.banks.banks) banks[b.id] = { b, billed: 0, tariffY: 0, benchY: 0, rel: R.banks[b.id], lender: fac.lenders.find(x => x.bank === b.id) };
  for (const i of inv) banks[i.acc.bank].billed += i.billed;
  for (const a of D.accounts) { banks[a.bank].tariffY += 12 * tariffEur(a, D.bankById[a.bank].fees); banks[a.bank].benchY += 12 * tariffEur(a, bench); }
  // RCF
  const drawn = fac.drawn_history.filter(h => h.date <= asof).slice(-1)[0]?.drawn_eur || 0, undrawn = fac.commitment_eur - drawn;
  const comPct = fac.margin_pct * fac.commitment_fee_pct_of_margin / 100;
  const rcfInt = drawn * (fac.reference_rate_pct + fac.margin_pct) / 100, rcfCom = undrawn * comPct / 100;
  const rcfBankY = drawn * fac.margin_pct / 100 + rcfCom; // bank income = margin + commitment fee
  let tot = 0;
  for (const k in banks) {
    const x = banks[k], r = x.rel;
    x.feesY = x.billed * 12 / months;
    x.rcfY = rcfBankY * (x.lender?.share_pct || 0) / 100;
    x.fxY = r.fx_volume_eur_year * r.fx_spread_pct / 100;
    x.depY = r.avg_deposits_eur * r.deposit_margin_pct / 100;
    x.totY = x.feesY + x.rcfY + x.fxY + x.depY; tot += x.totY;
    x.premium = x.tariffY / x.benchY - 1;
  }
  const maxShare = Math.max(...fac.lenders.map(l => l.share_pct));
  for (const k in banks) {
    const x = banks[k]; x.wallet = x.totY / tot; x.credit = (x.lender?.share_pct || 0) / 100;
    const sc = { credit: 5 * x.credit * 100 / maxShare, pricing: Math.max(1, Math.min(5, 5 - x.premium * 10)), ...x.rel.scores };
    x.scores = sc; x.score = Object.entries(R.weights).reduce((s, [c, w]) => s + sc[c] * w / 100, 0);
  }
  // covenants
  const L = fac.financials_ltm, last = L[L.length - 1], cash = groupCash(asof), low = Math.min(...forecast13(F).close);
  const cov = fac.covenants.map((c, i) => {
    const hist = L.map(q => i === 0 ? q.net_debt / q.ebitda : i === 1 ? q.ebitda / q.net_interest : null);
    const now = i === 2 ? (cash + undrawn) / 1e6 : hist[hist.length - 1];
    const fc = i === 2 ? (low + undrawn) / 1e6 : null;
    const head = c.test === 'max' ? 1 - now / c.limit : now / c.limit - 1;
    return { ...c, hist, now, fc, head, ok: c.test === 'max' ? now <= c.limit : now >= c.limit, okF: fc == null || fc >= c.limit };
  });
  return { inv, months, banks, tot, drawn, undrawn, comPct, rcfInt, rcfCom, cov, last };
}

function viewCov(r) {
  const L = D.fac.financials_ltm;

      <td class="r num"><b>${fmt(c.now, i === 2 ? 1 : 2)}${unit}</b></td><td class="r num">${fmt(100 * c.head, 0)}%</td><td><span class="chip ${c.ok && c.okF ? '' : 'unc'}">${c.ok && c.okF ? t('met') : t('breach')}</span></td></tr>`;
  }).join('');

    <div class="scroll"><table><thead><tr><th>${t('thTest')}</th><th class="r">${t('thLimit')}</th>${L.map(q => `<th class="r">${fmMonth(q.period.slice(0, 7))}</th>`).join('')}<th class="r">${t('today')}</th><th class="r">${t('thHead')}</th><th></th></tr></thead>

function calItems() {
  const R = D.rel, out = [];
  for (const id in R.banks) { const b = R.banks[id], n = D.bankById[id].name;
    out.push({ d: b.kyc_due, txt: `${t('kycDue')} · ${n}` });
    if (b.ebics_cert_expiry) out.push({ d: b.ebics_cert_expiry, txt: `${t('ebicsExp')} · ${n}` }); }
  for (const m of R.mandate_changes) out.push({ d: m.due, txt: `${t('mandate')} · ${m.account}` });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}

function viewBankReview(r) {
  const R = D.rel, B = D.banks.banks, crit = Object.keys(R.weights);
  const rows = crit.map(c => `<tr><td>${t('c_' + c)}</td><td class="r num muted">${R.weights[c]}%</td>${B.map(b => `<td class="r num">${fmt(r.banks[b.id].scores[c], 1)}</td>`).join('')}</tr>`).join('');
  const best = Math.max(...B.map(b => r.banks[b.id].score));
  const head = B.map(b => { const x = r.banks[b.id], rel = x.rel;
    return `<th class="r">${esc(b.name)}<div class="muted" style="font-weight:400;font-size:11.5px">${rel.rating} · ${t('sinceT')} ${rel.since}</div></th>`; }).join('');
  const rm = `<tr><td class="muted">${t('rmT')}</td><td></td>${B.map(b => `<td class="r" style="font-size:12.5px">${esc(r.banks[b.id].rel.rm)}</td>`).join('')}</tr>`;
  const ag = R.agenda.map(a => `<li><span class="chip" style="font-family:inherit">${a.bank === 'ALL' ? t('allBanks') : esc(D.bankById[a.bank].name)}</span> ${esc(a[S.lang])}</li>`).join('');
  const today = D.fs.as_of;
  const cal = calItems().map(i => { const days = Math.round((new Date(i.d) - new Date(today)) / 864e5);
    return `<li><span class="num ${days < 45 ? 'neg' : ''}" style="min-width:92px;display:inline-block">${fdate(i.d)}</span> ${esc(i.txt)} <span class="muted num">(${days} ${S.lang === 'fr' ? 'j' : 'd'})</span></li>`; }).join('');
  return `<section class="panel"><div class="ph"><div><h2>${t('revTitle')}</h2><div class="sub">${t('revSub')}</div></div></div>
    <div class="grid" style="gap:0">
      <div class="stack"><div class="scroll"><table><thead><tr><th></th><th class="r">${t('weight')}</th>${head}</tr></thead>
        <tbody>${rows}<tr class="tot"><td>${t('score')} / 5</td><td></td>${B.map(b => `<td class="r num">${r.banks[b.id].score === best ? '★ ' : ''}${fmt(r.banks[b.id].score, 2)}</td>`).join('')}</tr>${rm}</tbody></table></div></div>
      <div class="stack" style="border-left:1px solid var(--line)"><div class="pb"><h3 style="font-size:13.5px;margin:0 0 8px">${t('agTitle')}</h3><ul class="agenda">${ag}</ul>
        <h3 style="font-size:13.5px;margin:16px 0 2px">${t('calTitle')}</h3><div class="muted" style="font-size:12.5px;margin-bottom:8px">${t('calSub')}</div><ul class="agenda">${cal}</ul></div></div>
    </div></section>`;
}

function bindM4() {
  document.querySelectorAll('tr.click[data-acc]').forEach(tr => tr.addEventListener('click', () => { S.regOpen = S.regOpen === tr.dataset.acc ? null : tr.dataset.acc; render(); }));
}

/* ------------------------------------------------------------ boot */
async function boot() {
  const get = p => fetch(p).then(r => { if (!r.ok) throw new Error(p); return r; });
  const [accounts, entities, banks, categories, rules, fxcsv, manifest, glossary, cal, fs, snapcsv, arcsv, apcsv, pool, rel, fac] = await Promise.all([
    get('accounts.json').then(r => r.json()), get('entities.json').then(r => r.json()),
    get('banks.json').then(r => r.json()), get('categories.json').then(r => r.json()),
    get('rules.json').then(r => r.json()), get('fx_rates.csv').then(r => r.text()),
    get('manifest.json').then(r => r.json()), get('glossary.json').then(r => r.json()),
    get('forecast_calendar.json').then(r => r.json()), get('forecast_settings.json').then(r => r.json()),
    get('forecast_snapshot.csv').then(r => r.text()), get('open_receivables.csv').then(r => r.text()), get('open_payables.csv').then(r => r.text()), get('cash_pool.json').then(r => r.json()),
    get('bank_relations.json').then(r => r.json()), get('facility.json').then(r => r.json())
  ]);
  const fx = {}; const [hdr, ...rows] = fxcsv.trim().split(/\r?\n/); const cols = hdr.split(',');
  rows.forEach(r => { const v = r.split(','); fx[v[0]] = Object.fromEntries(cols.slice(1).map((c, i) => [c, +v[i + 1]])); });
  D = { banks, rel, fac, pool, cal, fs, snap: parseCSV(snapcsv), ar: parseCSV(arcsv), ap: parseCSV(apcsv), glossary, accounts, entities, categories, rules: rules.slice().sort((a, b) => a.priority - b.priority), fx, fxDates: Object.keys(fx).sort(),
        byIban: Object.fromEntries(accounts.map(a => [a.iban, a])), entById: Object.fromEntries(entities.map(e => [e.id, e])),
        bankById: Object.fromEntries(banks.banks.map(b => [b.id, b])), catById: Object.fromEntries(categories.map(c => [c.id, c])) };
  FILES = await Promise.all(manifest.map(async m => {
    const url = m.file, text = await get(url).then(r => r.text());
    const p = parseStatement(text);
    return { name: m.file, format: p.format, statements: p.statements, text, url };
  }));
  HOL = new Set(D.fs.holidays);
  rebuild(); render();
}
document.getElementById('lang-en').onclick = () => { S.lang = 'en'; try { localStorage.setItem('tos-lang', 'en'); } catch (e) {} render(); };
document.getElementById('lang-fr').onclick = () => { S.lang = 'fr'; try { localStorage.setItem('tos-lang', 'fr'); } catch (e) {} render(); };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.view = b.dataset.tab; try { history.replaceState(null, '', '#' + S.view); } catch (e) {} render(); window.scrollTo(0, 0); });
if (['#glossary', '#m4', '#m3', '#m2', '#m1'].includes(location.hash)) S.view = location.hash.slice(1);
document.getElementById('asof').onchange = e => { S.asof = e.target.value; render(); };
boot().catch(err => { document.getElementById('app').innerHTML = `<div class="loading">Could not load the data files (${esc(err.message)}). Serve the folder over http, for example with Netlify.</div>`; });
</script>
